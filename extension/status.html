<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickup Watcher</title>
<link rel="stylesheet" href="page.css">
</head>
<body>
  <header><h1>Pickup Watcher</h1><span id="mode"></span><a href="options.html">Settings</a></header>
  <div id="setup" class="banner" hidden></div>
  <div id="summary" class="muted"></div>
  <div class="buttons">
    <button data-cmd="pollNow">Check now</button>
    <button id="toggle"></button>
    <button data-cmd="testNotify">Send a test notification</button>
    <button data-cmd="simulateHit">Simulate a hit</button>
    <button id="download">Download logs</button>
  </div>
  <div id="result" class="muted"></div>

  <h2>Pickup</h2>
  <div class="table-wrap"><table id="grid"></table></div>

  <h2>Recent changes</h2>
  <ul id="changes"></ul>

  <p class="muted">Checks run in a pinned apple.com tab in this Chrome profile; if you close it, the next check reopens it. Chrome has to be running and the computer awake.</p>

  <script type="module" src="status.js"></script>
</body>
</html>
